<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="BOARD — canvas estratégico para mapas mentais, fluxos e planejamento visual.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=4">
  <title>BOARD — Strategic Canvas</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><span></span></span>
      <div class="brand-copy"><strong>BOARD</strong><small>Strategic Canvas</small></div>
    </div>

    <div class="project-center">
      <button id="projectsBtn" class="projects-trigger" title="Abrir meus projetos">▦ <span>Meus projetos</span></button>
      <input id="projectName" class="project-name" value="Novo projeto" aria-label="Nome do projeto">
    </div>

    <div class="top-actions">
      <span id="saveStatus" class="save-pill">☁ <span>Salvo automaticamente</span></span>
      <button id="themeBtn" class="icon-btn" title="Alternar tema">☾</button>
      <button id="installBtn" class="ghost" hidden>Instalar</button>
      <button id="presentBtn" class="primary">▶ <span>Apresentar</span></button>
      <div class="avatar">RB</div>
    </div>
  </header>

  <main class="workspace">
    <aside class="toolbar" aria-label="Ferramentas">
      <button data-tool="select" class="active" title="Selecionar"><span>↖</span><small>Selecionar</small></button>
      <button id="mindMapBtn" class="map-tool" title="Criar mapa mental"><span>✦</span><small>Mapa</small></button>
      <button data-tool="text" title="Texto"><span>T</span><small>Texto</small></button>
      <button data-tool="note" title="Nota"><span>▰</span><small>Nota</small></button>
      <button data-tool="rect" title="Bloco"><span>▭</span><small>Bloco</small></button>
      <button data-tool="connect" title="Conectar blocos"><span>⤴</span><small>Conectar</small></button>
      <button id="imageBtn" title="Adicionar imagem"><span>▧</span><small>Imagem</small></button>
      <div class="tool-spacer"></div>
      <button id="deleteBtn" title="Excluir"><span>⌫</span><small>Excluir</small></button>
    </aside>

    <section class="stage-wrap" id="stageWrap">
      <div class="canvas-actions">
        <button id="newMindMapBtn" class="canvas-primary">✦ Criar mapa mental</button>
        <button id="newBlockBtn">＋ Novo bloco</button>
      </div>

      <div id="stage" class="stage" tabindex="0" aria-label="Quadro estratégico">
        <svg id="connections" class="connections" aria-hidden="true"></svg>
      </div>

      <div id="emptyHint" class="empty-state">
        <div class="empty-badge">✦</div>
        <h1>Comece com uma ideia.</h1>
        <p>Crie mapas mentais, conecte blocos e organize sua estratégia visualmente.</p>
        <div class="empty-actions">
          <button id="emptyMapBtn" class="primary-empty">✦ Criar primeiro mapa</button>
          <button id="emptyNoteBtn">＋ Adicionar nota</button>
        </div>
      </div>

      <div class="zoom-control">
        <button id="zoomOut">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn">＋</button>
      </div>
    </section>

    <aside class="slides-panel">
      <div class="slides-head">
        <div><strong>Páginas</strong><small>Organize seu projeto</small></div>
        <button id="addSlideBtn" title="Nova página">＋</button>
      </div>
      <div id="slidesList"></div>
      <button id="newPageBtn" class="new-page">＋ Nova página</button>
      <div class="panel-footer"><span id="offlineStatus">● Online</span><span>BOARD</span></div>
    </aside>
  </main>

  <div id="projectsModal" class="projects-modal" hidden>
    <div class="projects-backdrop" data-close-projects></div>
    <section class="projects-dialog" role="dialog" aria-modal="true" aria-labelledby="projectsTitle">
      <header class="projects-dialog-head">
        <div>
          <span class="eyebrow">BOARD Workspace</span>
          <h2 id="projectsTitle">Meus projetos</h2>
          <p>Crie, abra, duplique e organize todos os seus boards.</p>
        </div>
        <button id="closeProjectsBtn" class="dialog-close" aria-label="Fechar">×</button>
      </header>
      <div class="projects-toolbar">
        <button id="createProjectBtn" class="projects-primary">＋ Novo projeto</button>
        <button id="duplicateProjectBtn">⧉ Duplicar atual</button>
        <button id="exportProjectBtn">⇩ Exportar</button>
        <label class="import-label">⇧ Importar<input id="importProjectInput" type="file" accept="application/json,.json" hidden></label>
      </div>
      <div id="projectsGrid" class="projects-grid"></div>
    </section>
  </div>

  <input id="imageInput" type="file" accept="image/*" hidden>
  <script src="app.js?v=5" defer></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=v5', {updateViaCache:'none'}).then(r=>r.update()).catch(console.error));
    }
  </script>
</body>
</html>
