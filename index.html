<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BOARD">
  <meta name="description" content="BOARD — quadro estratégico visual para desenhar, organizar projetos e apresentar ideias.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>BOARD — Strategic Canvas</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span><strong>BOARD</strong><small>Strategic Canvas</small></div>
    <input id="projectName" class="project-name" value="Novo projeto" aria-label="Nome do projeto">
    <div class="top-actions">
      <button id="installBtn" class="ghost" hidden>Instalar</button>
      <button id="presentBtn" class="primary">Apresentar</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="toolbar" aria-label="Ferramentas">
      <button data-tool="select" class="active" title="Selecionar">↖</button>
      <button data-tool="text" title="Texto">T</button>
      <button data-tool="note" title="Nota">▣</button>
      <button data-tool="rect" title="Bloco">▭</button>
      <button data-tool="arrow" title="Seta">→</button>
      <button id="deleteBtn" title="Excluir">⌫</button>
    </aside>

    <section class="stage-wrap">
      <div id="stage" class="stage" tabindex="0" aria-label="Quadro estratégico"></div>
      <div id="emptyHint" class="empty-hint">
        <strong>Transforme estratégia em visão.</strong>
        <span>Adicione textos, notas e blocos. Arraste livremente pelo quadro.</span>
      </div>
    </section>

    <aside class="slides-panel">
      <div class="slides-head"><strong>Páginas</strong><button id="addSlideBtn" title="Nova página">＋</button></div>
      <div id="slidesList"></div>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="saveStatus">Salvo localmente</span>
    <span id="offlineStatus">Online</span>
    <span id="zoomLabel">100%</span>
  </footer>

  <script src="app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=v1', { updateViaCache: 'none' }).then(r => r.update()).catch(console.error));
    }
  </script>
</body>
</html>
